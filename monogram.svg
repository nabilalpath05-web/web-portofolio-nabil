<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FF4D" />
      <stop offset="100%" stop-color="#82db14" />
    </linearGradient>
  </defs>
  <!-- Sleek Squircle Box with Micro-Border -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#141416" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Minimalist Geometric Monogram N & R interconnected -->
  <!-- N stem -->
  <path d="M 14 34 L 14 14 L 21 27 L 21 14" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- R form seamlessly connected -->
  <path d="M 27 34 L 27 14 L 32.5 14 C 35 14 36.5 15.8 36.5 18.5 C 36.5 21.2 35 23 32.5 23 L 27 23 M 31 23 L 36.5 34" stroke="url(#monoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Signature Accent Dot -->
  <circle cx="39" cy="34" r="1.8" fill="#C6FF4D"/>
</svg>

